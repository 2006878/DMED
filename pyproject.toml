[project]
name = "dmed"
version = "0.1.0"
description = "Informe de plano de saúde para o IRPF e geração do arquivo DMED da COSEMI."
requires-python = ">=3.11"
dependencies = [
    "fpdf==1.7.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0,<2.4",
    "requests>=2.32.0",
    "streamlit>=1.50.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=2.3,<2.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "time-machine>=3.6.0",
    "types-requests>=2.33.0.20261006",
]
