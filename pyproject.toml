[project]
name = "dmed"
version = "0.1.0"
description = "Informe de plano de saúde para o IRPF e geração do arquivo DMED da COSEMI."
requires-python = ">=3.11"
dependencies = [
    "fpdf==1.7.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0,<2.4",
    "requests>=2.32.0",
    "streamlit>=1.50.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=2.3,<2.4",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "time-machine>=3.6.0",
    "types-requests>=2.33.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle (avisos)
    "F",    # pyflakes
    "I",    # ordenação de imports
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit (segurança)
    "BLE",  # except genérico
    "C4",   # comprehensions
    "SIM",  # simplificações
    "RET",  # returns
    "PERF", # desempenho
    "PD",   # pandas-vet
    "DTZ",  # datetime sem fuso horário
    "PTH",  # pathlib
    "N",    # nomes (PEP 8)
    "T20",  # print
    "ERA",  # código comentado
    "PL",   # pylint
    "RUF",  # regras do próprio ruff
]
ignore = [
    "E501",  # o formatter cuida do tamanho das linhas
    "N818",  # exceções têm nomes em português, sem o sufixo "Error"
    "PD008", # .at é o acesso escalar idiomático do pandas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["main.py", "src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fpdf", "fpdf.*"]
ignore_missing_imports = true
