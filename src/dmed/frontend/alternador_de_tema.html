<!--
  Interruptor de tema claro/escuro, desenhado no canto do cabeçalho por
  componentes.alternador_de_tema(). Os marcadores __ESTILO__, __ESCURO__ e
  __CHAVES__ são trocados pelo Python. O visual está em estilo.css (.alternador).

  O Streamlit só lê o tema escolhido ao abrir a página: o interruptor grava a
  escolha no navegador e recarrega a página, que volta ao estado inicial.
-->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>__ESTILO__</style>
</head>
<body class="corpo-alternador">
<button type="button" class="alternador" role="switch" aria-checked="__ESCURO__"
        aria-label="Modo escuro" title="Alternar entre o modo claro e o escuro">
  <svg class="alternador-lua" viewBox="0 0 40 32" aria-hidden="true">
    <path d="M22 6a10 10 0 1 0 8 15A8 8 0 0 1 22 6z" />
    <path class="estrela" d="M7 6l1 2.2L10.2 9 8 10l-1 2.2L6 10 3.8 9 6 8.2z" />
    <path class="estrela" d="M33 4l.7 1.5 1.5.7-1.5.7L33 8.4l-.7-1.5-1.5-.7 1.5-.7z" />
    <path class="estrela" d="M35 22l.6 1.3 1.3.6-1.3.6-.6 1.3-.6-1.3-1.3-.6 1.3-.6z" />
  </svg>
  <svg class="alternador-sol" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="6" />
    <path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M6.8 25.2l2.8-2.8M22.4 9.6l2.8-2.8" />
  </svg>
  <span class="alternador-botao"></span>
</button>
<script>
  const alternador = document.querySelector(".alternador");
  const escuro = alternador.getAttribute("aria-checked") === "true";
  const curso = 44;  // quanto o círculo anda, em px (mesmo valor do estilo.css)
  let inicio = null;
  let arrastou = false;

  function gravar(novoEscuro) {
    alternador.classList.remove("arrastando");
    alternador.style.removeProperty("--deslocamento");
    alternador.setAttribute("aria-checked", String(novoEscuro));
    const pagina = window.parent;
    const chaves = __CHAVES__;
    chaves.push("stActiveTheme-" + pagina.location.pathname + "-v2");
    // Espera a animação do círculo antes de recarregar.
    setTimeout(() => {
      for (const chave of chaves) {
        pagina.localStorage.setItem(chave, JSON.stringify(novoEscuro ? "Dark" : "Light"));
      }
      pagina.location.reload();
    }, 260);
  }

  function voltar() {
    alternador.classList.remove("arrastando");
    alternador.style.removeProperty("--deslocamento");
  }

  alternador.addEventListener("pointerdown", (evento) => {
    inicio = evento.clientX;
    arrastou = false;
    alternador.setPointerCapture(evento.pointerId);
  });

  alternador.addEventListener("pointermove", (evento) => {
    if (inicio === null) return;
    const dx = evento.clientX - inicio;
    if (Math.abs(dx) > 4) {
      arrastou = true;
      alternador.classList.add("arrastando");
    }
    const base = escuro ? curso : 0;
    const posicao = Math.min(curso, Math.max(0, base + dx));
    alternador.style.setProperty("--deslocamento", posicao + "px");
  });

  alternador.addEventListener("pointerup", (evento) => {
    if (inicio === null) return;
    const dx = evento.clientX - inicio;
    inicio = null;
    if (!arrastou) {
      gravar(!escuro);
      return;
    }
    const passou = escuro ? dx < -curso / 2 : dx > curso / 2;
    if (passou) gravar(!escuro); else voltar();
  });

  alternador.addEventListener("pointercancel", () => {
    inicio = null;
    voltar();
  });

  // Teclado: Enter e espaço disparam o clique sem eventos de ponteiro.
  alternador.addEventListener("click", (evento) => {
    if (evento.detail === 0) gravar(!escuro);
  });
</script>
</body>
</html>
